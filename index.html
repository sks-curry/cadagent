<!doctype html>
<html lang="zh-CN" data-theme="light" data-font="noto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="agent-token" content="__AGENT_TOKEN__">
<title>形构 · CAD Agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2323755c'/%3E%3Cpath d='M16 6 26 12v10l-10 5-10-5V12Z M6 12l10 5 10-5 M16 17v10' fill='none' stroke='white' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/styles.css">
<script type="module" src="/static/app.js"></script>
</head>
<body>
<svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
<symbol id="i-cube" viewBox="0 0 24 24"><path d="m12 3 9 5v9l-9 5-9-5V8Z M3 8l9 5 9-5 M12 13v9 M7.5 5.5l9 5"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14 M5 12h14"/></symbol>
<symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5 8.5 8.5 0 1 0 20.5 14.3Z"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5 M6.5 10.5 12 5l5.5 5.5"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></symbol>
<symbol id="i-clip" viewBox="0 0 24 24"><path d="m8 13 7-7a3 3 0 0 1 4 4L9 20a5 5 0 0 1-7-7L13 2 M6 15l10-10"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v10H3Z"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h4"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h5m4 0h7M4 12h9m4 0h3M4 18h2m4 0h10"/><circle cx="11" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></symbol>
<symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12 M6 18 18 6"/></symbol>
</svg>
<main class="workspace">
  <button class="sidebar-shade" id="sidebarShade" aria-label="关闭项目栏"></button>
  <aside class="sidebar" aria-label="项目与模型">
    <div class="brand"><div class="brand-mark"><svg class="icon"><use href="#i-cube"/></svg></div><h1>形构</h1><span>CAD AGENT</span></div>
    <button id="newProject" class="new-project"><svg class="icon"><use href="#i-plus"/></svg>新建设计</button>
    <section>
      <div class="section-heading"><h2>项目</h2></div>
      <input id="projectSearch" class="project-search" placeholder="搜索项目" aria-label="搜索项目" autocomplete="off">
      <nav id="projectList" class="project-list" aria-label="项目列表"><p class="empty-list">暂无项目</p></nav>
    </section>
    <section class="model-section">
      <div class="section-heading"><h2>当前模型</h2><button id="inspect" class="small subtle" title="检查并保存当前模型">检查并保存</button></div>
      <div class="preview">
        <div id="placeholder" class="placeholder"><svg class="icon"><use href="#i-cube"/></svg>等待建模</div>
        <img id="preview" class="hidden" alt="当前模型，点击放大">
      </div>
      <div class="stats"><span><strong id="bodyCount">0</strong>实体</span><span><strong id="featureCount">0</strong>特征</span><span><strong id="paramCount">0</strong>参数</span></div>
      <div id="files" class="files"></div>
    </section>
    <div class="sidebar-bottom">
      <details class="settings-panel" id="connectionPanel">
        <summary><svg class="icon"><use href="#i-settings"/></svg>连接与显示<span id="configState" class="trailing">未配置</span></summary>
        <form class="settings-content" id="connectionForm">
          <label for="key">API Key</label><input id="key" type="password" autocomplete="off" placeholder="留空沿用当前密钥">
          <label for="model">模型</label><input id="model" value="deepseek-flash" spellcheck="false">
          <div class="display-grid"><div><label for="reasoning">思考强度</label><select id="reasoning"><option value="off">关闭</option><option value="low">低</option><option value="high" selected>高</option><option value="max">最高</option></select></div>
          <div><label for="execution">执行方式</label><select id="execution"><option value="deepseek">智能体</option><option value="local">本地规则</option></select></div></div>
          <div class="setting-row"><input id="remember" type="checkbox" checked><label for="remember">加密保存到本机</label></div>
          <div class="config-buttons"><button id="saveConfig" class="primary" type="button">保存连接</button><button id="clearKey" class="subtle small" type="button">清除</button></div>
          <div class="display-settings"><div class="display-grid"><div><label for="fontChoice">字体</label><select id="fontChoice"><option value="noto">Noto Sans SC</option><option value="system">系统默认</option><option value="yahei">微软雅黑</option></select></div>
          <div><label for="fontSize">字号</label><select id="fontSize"><option value="normal">标准</option><option value="large">大</option></select></div></div></div>
        </form>
      </details>
      <details class="logs-panel"><summary><svg class="icon"><use href="#i-activity"/></svg>执行记录<span id="logBadge" class="trailing"></span></summary>
        <div id="logs" class="logs"></div><details class="state-details"><summary>模型数据</summary><pre id="stateJson">{}</pre></details>
      </details>
      <div class="connection"><i id="dot" class="dot"></i><span id="connection">正在连接</span></div>
    </div>
  </aside>
  <section class="conversation" aria-label="设计对话">
    <header class="chat-header">
      <div class="header-left"><button id="sidebarToggle" class="icon-button" aria-label="切换项目栏" title="切换项目栏"><svg class="icon"><use href="#i-sidebar"/></svg></button>
      <button id="modelPicker" class="model-picker" title="连接设置"><span id="modelLabel">DeepSeek</span><svg class="icon"><use href="#i-chevron"/></svg></button></div>
      <div class="chat-actions"><span id="taskState">就绪</span><button id="continueTask" class="small subtle hidden">继续任务</button><button id="themeToggle" class="icon-button" aria-label="切换深色主题" title="切换深色主题"><svg class="icon"><use href="#i-moon"/></svg></button></div>
    </header>
    <div class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="welcome-symbol"><svg class="icon"><use href="#i-cube"/></svg></div><h2>让想法，成为零件。</h2><p>描述尺寸，或从一张草图开始。</p>
        <div class="samples"><button class="sample" data-prompt="画一个80×60×30 mm的实心长方体">实心长方体</button><button class="sample" data-prompt="画一个M5螺母，根据国标要求。需要实际的M5×0.8内螺纹及上下圆周倒角。">M5 螺母</button><button class="sample" data-prompt="根据参考图提取结构与尺寸，补齐关键参数后建模出图。">从草图建模</button></div>
      </div>
      <div id="working" class="working hidden" role="status"><span id="workingText">正在处理</span></div>
    </div>
    <details class="brief-panel hidden" id="briefPanel"><summary><svg class="icon"><use href="#i-chevron"/></svg>设计参数<span id="briefState" class="trailing"></span></summary><div class="brief-content"><p id="briefStructure"></p><table class="brief-table"><tbody id="briefParameters"></tbody></table><ol id="briefQuestions" class="questions"></ol><div id="references" class="reference-list"></div></div></details>
    <div class="composer" id="composer"><div class="input-box">
      <div id="attachments" class="attachments" aria-live="polite"></div><textarea id="prompt" rows="2" aria-label="建模需求或补充参数" placeholder="描述零件，或补充尺寸……"></textarea>
      <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
      <div class="composer-actions"><button id="addImages" type="button" title="PNG / JPEG / WebP，最多4张；单张8 MB，合计16 MB。图片发送给当前模型识别。"><svg class="icon"><use href="#i-clip"/></svg>参考图</button>
      <div class="send-tools"><span class="shortcut">Enter 发送 · Shift + Enter 换行</span>
        <button id="send" class="send-button" aria-label="发送需求" title="发送需求" disabled><svg class="icon"><use href="#i-arrow"/></svg></button>
        <button id="stop" class="send-button hidden" aria-label="停止后续调用" title="停止后续调用"><svg class="icon"><use href="#i-stop"/></svg></button>
      </div></div>
    </div></div>
  </section>
</main>
<div id="toast" class="toast hidden" role="status"></div>
<dialog id="imageDialog" class="image-dialog"><header><span id="imageTitle"></span><button id="closeImage" class="icon-button" aria-label="关闭图片"><svg class="icon"><use href="#i-close"/></svg></button></header><img id="dialogImage" alt=""></dialog>
</body>
</html>
